name: Publish

on:
  # A release is a one-line PR bumping "version" in package.json. Merging it lands a
  # version that differs from the one on npm, which is the signal to publish. Fern's
  # regeneration PRs are pinned to the published version by the monorepo train, so they
  # never look like a release.
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:
    inputs:
      version:
        description: "Override: publish this version instead of the one in package.json"
        required: false

permissions:
  contents: write
  # npm Trusted Publishing: @whop/sdk trusts this repo+workflow as a publisher and npm
  # publish authenticates with the OIDC token Actions mints for the run. The trusted
  # publisher on npmjs.com must name THIS filename.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up npm and pnpm
        run: |
          npm install -g npm@11
          corepack enable

      - name: Decide whether this is a release
        id: decide
        env:
          OVERRIDE: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            npm pkg set version="$OVERRIDE"
          fi

          version=$(node -p "require('./package.json').version")
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not semver."
            exit 1
          fi

          if npm view "@whop/sdk@$version" version >/dev/null 2>&1; then
            echo "@whop/sdk@$version is already published — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Releasing @whop/sdk@$version"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.decide.outputs.release == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Publish @whop/sdk
        if: steps.decide.outputs.release == 'true'
        run: npm publish --access public

      - name: Tag and release
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
