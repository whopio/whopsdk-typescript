name: Publish

on:
  push:
    branches: [main]
    paths: ["package.json"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything except the actual publish and tag"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-whop-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      dry: ${{ steps.check.outputs.dry }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Is this a release?
        id: check
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "pull_request" ] || [ "$DRY_RUN" = "true" ]; then
            echo "dry=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Dry run: exercising the pipeline without publishing or tagging."
            exit 0
          fi

          echo "dry=false" >> "$GITHUB_OUTPUT"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not stable semver; prereleases are not released from main."
            exit 1
          fi

          if [ "$EVENT" = "push" ] && git rev-parse HEAD^ >/dev/null 2>&1; then
            if ! git show HEAD^:package.json > /tmp/prev.json 2>/dev/null; then
              echo "::error::could not read the previous package.json."
              exit 1
            fi

            only_version=$(node -e '
              const fs = require("fs");
              const prev = JSON.parse(fs.readFileSync("/tmp/prev.json", "utf8"));
              const next = JSON.parse(fs.readFileSync("package.json", "utf8"));
              prev.version = next.version;
              process.stdout.write(JSON.stringify(prev) === JSON.stringify(next) ? "yes" : "no");
            ')

            if [ "$only_version" != "yes" ]; then
              echo "package.json changed beyond its version — this is a regeneration, not a release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if out=$(npm view "@whop/sdk@$version" version 2>&1); then
            echo "@whop/sdk@$version is already published ($out) — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q "E404"; then
            echo "Releasing @whop/sdk@$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view failed, refusing to guess: $out"
            exit 1
          fi

  build:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Sync the version stamps
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const edits = [
              ["src/version.ts", /"[^"]*"/],
              ["src/BaseClient.ts", /(?<="X-Fern-SDK-Version": ")[^"]*/g],
              [".fern/metadata.json", /(?<="sdkVersion": ")[^"]*/g],
            ];
            fs.writeFileSync("src/version.ts", `export const SDK_VERSION = "${v}";\n`);
            let base = fs.readFileSync("src/BaseClient.ts", "utf8");
            base = base.replace(/("X-Fern-SDK-Version": ")[^"]*/g, `$1${v}`);
            base = base.replace(/(@whop\/sdk\/)[0-9][^"]*/g, `$1${v}`);
            fs.writeFileSync("src/BaseClient.ts", base);
            const meta = JSON.parse(fs.readFileSync(".fern/metadata.json", "utf8"));
            meta.sdkVersion = v;
            fs.writeFileSync(".fern/metadata.json", JSON.stringify(meta, null, 2) + "\n");
          '
          grep -c "$VERSION" src/version.ts src/BaseClient.ts .fern/metadata.json

      - name: Build, test and pack
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          CI=true pnpm test
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack
          ls -l /tmp/pack

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: /tmp/pack/*.tgz
          retention-days: 7

  publish:
    needs: [decide, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up npm
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          npm --version

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: /tmp/pack

      - name: Publish @whop/sdk
        env:
          DRY_RUN: ${{ needs.decide.outputs.dry }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            npm publish /tmp/pack/*.tgz --access public --dry-run
            echo "Dry run: nothing was uploaded."
            exit 0
          fi

          npm publish /tmp/pack/*.tgz --access public

  tag:
    needs: [decide, publish]
    if: always() && needs.decide.outputs.dry == 'false' && needs.decide.outputs.version != '' && needs.publish.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Tag and release
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! npm view "@whop/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@whop/sdk@$VERSION is not on npm; nothing to tag."
            exit 0
          fi

          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists."
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
