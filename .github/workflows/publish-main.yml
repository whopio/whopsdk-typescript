name: Publish

on:
  # A release is a one-line PR bumping "version" in package.json. Merging it lands a
  # version that differs from the one on npm, which is the signal to publish. Fern's
  # regeneration PRs are pinned to the published version by the monorepo train, so they
  # never look like a release. Re-dispatch to retry a failed publish: the decide job
  # re-checks npm, so a version already on the registry is a no-op.
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Is this version already on npm?
        id: check
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not semver."
            exit 1
          fi

          # Distinguish "not published" from "the registry call failed" — treating an
          # outage as "not published" would publish on a version that already exists.
          if out=$(npm view "@whop/sdk@$version" version 2>&1); then
            echo "@whop/sdk@$version is already published ($out) — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q "E404"; then
            echo "Releasing @whop/sdk@$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view failed, refusing to guess: $out"
            exit 1
          fi

  # Deliberately separate from publish: installing and building runs third-party code
  # (devDependencies, tsc, biome), and that must not happen in a job carrying the
  # publishing credential. This job has no id-token, so there is nothing to steal.
  build:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build and pack
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          npm pack --pack-destination /tmp/pack

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: /tmp/pack/*.tgz
          retention-days: 7

  publish:
    needs: [decide, build]
    runs-on: ubuntu-latest
    permissions:
      # npm Trusted Publishing: @whop/sdk trusts this repo+workflow as a publisher and
      # npm authenticates with the OIDC token Actions mints for the run. The trusted
      # publisher on npmjs.com must name THIS filename. Nothing else runs in this job.
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up npm
        run: |
          set -euo pipefail
          # Pinned: this runs in the job that can publish. Trusted publishing needs >=11.5.1.
          npm install -g npm@11.6.2
          npm --version

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: /tmp/pack

      - name: Publish @whop/sdk
        run: npm publish /tmp/pack/*.tgz --access public

  tag:
    needs: [decide, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Tag and release
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; leaving it alone."
            exit 0
          fi

          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
